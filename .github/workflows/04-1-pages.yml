name: 部署前端到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'stage-04/04-1-Docker打包与本地运行/starter/app/frontend/**'
      - '.github/workflows/04-1-pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 安装前端依赖
        working-directory: stage-04/04-1-Docker打包与本地运行/starter/app/frontend
        run: npm install --no-audit --no-fund

      - name: 编译前端
        working-directory: stage-04/04-1-Docker打包与本地运行/starter/app/frontend
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build -- --mode github-pages --base "$PAGES_BASE_PATH"

      - name: 上传 Pages 构建文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: stage-04/04-1-Docker打包与本地运行/starter/app/frontend/dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
